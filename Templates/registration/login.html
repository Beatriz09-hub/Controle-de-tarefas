{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador de tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'app_ControleDeTarefas/styles/index.css' %}">

</head>
<body>
    {% if form.non_field_errors %}
        {% for erro in form.non_field_errors %}
            <div class="alert alert-danger" role="alert">
                {{ erro }}
            </div>
        {% endfor %}
    {% endif %}
    
    <h1>Login</h1>
   
    <form class="login-form" method="POST" action="{% url 'login' %}">
        {% csrf_token %} 
        
        <label for="nome"> Email: </label>
        <input type ="text" id="nome" name="username" class="form-control" placeholder="Digite seu email: "><br></br>
        {{form.username.errors}}

        <label for="senha"> Senha: </label>
        <input type ="password" id="senha" name="password" class="form-control" placeholder="Digite sua senha: "><br></br>
        {{form.password.errors}}
         
        <div class="mb-3">
            <a href="{% url 'register'%}"> Cadastre-se </a>
        </div>
        
        <button type="submit" >Entrar</button>
             

    </form>
</body>
</html>
